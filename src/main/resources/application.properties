# Oracle DB
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@//${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# security
cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
jwt.secret-key=${JWT_SECRET}
jwt.access-expiration-time=${JWT_ACCESS_EXPIRATION_TIME}
jwt.refresh-expiration-time=${JWT_REFRESH_EXPIRATION_TIME}
logging.level.org.springframework.security=DEBUG
spring.security.user.name=disabled
spring.security.user.password=disabled
# MyBatis
mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.type-handlers-package=erp.global.mybatis
## XML
mybatis.type-aliases-package=erp
# SQL
logging.level.com.example.mapper=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.java.sql=DEBUG
logging.level.net.ttddyy=DEBUG
logging.level.net.ttddyy.dsproxy=DEBUG
logging.level.net.ttddyy.dsproxy.listener.Slf4jQueryLoggingListener=DEBUG
# datasource-proxy
decorator.datasource.enabled=true
decorator.datasource.datasource-proxy.logging=slf4j
decorator.datasource.datasource-proxy.multiline=true
decorator.datasource.datasource-proxy.query.enable-logging=true
decorator.datasource.datasource-proxy.slow-query.enable-logging=true
decorator.datasource.datasource-proxy.slow-query.threshold=500
# JSON Enum
spring.jackson.mapper.accept-case-insensitive-enums=true
# springdoc
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true
# /*@AuthenticationPrincipal UserPrincipal user*/
